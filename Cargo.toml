[package]
name = "apoe-typer"
version = "0.3.0"
edition = "2021"
description = "APOE genotyper (rs429358 / rs7412) for VCF and gVCF files, with a CLI and a local browser interface"
default-run = "apoe-typer"
publish = false

[lib]
name = "apoe_typer"
path = "src/lib.rs"

[[bin]]
name = "apoe-typer"
path = "src/main.rs"

[[bin]]
name = "apoe-typer-web"
path = "src/bin/apoe-typer-web/main.rs"

[dependencies]
flate2 = "1.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
