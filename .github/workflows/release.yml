name: Release

# Push a tag vX.Y.Z (equal to the version in Cargo.toml) to build apoe-typer-web for
# Windows x64, Windows ARM64, and macOS Apple silicon, and attach the files to the release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc,  os: windows-2025, name: windows-x64 }
          - { target: aarch64-pc-windows-msvc, os: windows-2025, name: windows-arm64 }
          - { target: aarch64-apple-darwin,    os: macos-15,     name: macos-arm64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Tag must equal the Cargo.toml version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "${GITHUB_REF_NAME}" = "v${version}" ] || { echo "::error::tag ${GITHUB_REF_NAME} but Cargo.toml has ${version}"; exit 1; }
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --bin apoe-typer-web --target ${{ matrix.target }}
      - name: Package
        run: |
          out=target/${{ matrix.target }}/release
          base="apoe-typer-web_v${VERSION}_${{ matrix.name }}"
          mkdir -p pkg
          if [ "${{ matrix.os }}" = macos-15 ]; then
            tar -C "$out" -czf "pkg/$base.tar.gz" apoe-typer-web
            (cd pkg && shasum -a 256 "$base.tar.gz" > "$base.tar.gz.sha256")
          else
            cp "$out/apoe-typer-web.exe" "pkg/$base.exe"
            (cd pkg && sha256sum "$base.exe" > "$base.exe.sha256")
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: pkg/*
